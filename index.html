<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!--Slider-->
    <div class="slider">
        <figure>
            <!--One slide-->
            <div class="slide">
                <p>Look This</p>
                <img src="./images/1.jpg" alt="Image 1">
            </div>
             <div class="slide">
                <p>Look This</p>
                <img src="./images/2.jpg" alt="Image 2">
            </div>
             <div class="slide">
                <p>Programming Videos</p>
                <img src="./images/3.jpg" alt="Image 3">
            </div>
             <div class="slide">
                <p>Web designing Videos</p>
                <img src="./images/4.jpg" alt="Image 4">
            </div>
             <div class="slide">
                <p>Networking video</p>
                <img src="./images/5.jpg" alt="Image 5">
            </div>
        </figure>
    </div>
</body>
</html>
